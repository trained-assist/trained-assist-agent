<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{EXPO_TITLE}} — Каталог участников</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{FAVICON_EMOJI}}</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --g:#1b3c28;--g2:#2d5c3e;--gl:#e6efe9;--red:#d63b2a;--tgt:#1a1a18;--nrt:#c97a00;
  --bg:#fafaf8;--sf:#ffffff;--bd:#e0ddd8;--tx:#1a1a18;--mu:#6b6b67;--lb:#f0ede8;
  --tip-bg:#1a1a18;--tip-tx:#ede9e3;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111812;--sf:#1b2b1d;--bd:#273329;--tx:#ede9e3;--mu:#828a7e;--gl:#1a2e1d;--lb:#192119;
}}
:root[data-theme=dark]{--bg:#111812;--sf:#1b2b1d;--bd:#273329;--tx:#ede9e3;--mu:#828a7e;--gl:#1a2e1d;--lb:#192119;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'PT Sans',sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.site-header{background:var(--g);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:'Montserrat',sans-serif;font-weight:700;font-size:20px;color:#fff;letter-spacing:.06em;text-decoration:none}
.logo em{color:var(--red);font-style:normal}
.header-info{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;color:rgba(255,255,255,.55);text-align:right;line-height:1.4}
.hero{background:var(--g);padding:32px 28px 44px;color:#fff;position:relative;overflow:visible}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 110% -20%,rgba(214,59,42,.18) 0%,transparent 60%),radial-gradient(ellipse at -10% 120%,rgba(45,92,62,.45) 0%,transparent 55%);pointer-events:none}
.hero-wave{height:28px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0;margin:18px -4px -1px}
.hero-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.hero-eyebrow{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px}
.hero-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(22px,4vw,40px);line-height:1.08;margin-bottom:14px}
.hero-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.search-box{flex:1;min-width:180px;max-width:340px;position:relative}
.search-box input{width:100%;padding:9px 12px 9px 36px;border:none;border-radius:6px;font-family:'PT Sans',sans-serif;font-size:15px;background:rgba(255,255,255,.12);color:#fff;outline:none}
.search-box input::placeholder{color:rgba(255,255,255,.42)}
.search-box input:focus{background:rgba(255,255,255,.2)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.45);pointer-events:none}
.filters-group{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.filter-row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.filter-label{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.38);min-width:52px;flex-shrink:0}
.filter-btn{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.7);background:transparent;cursor:pointer;transition:all .14s;white-space:nowrap;line-height:1.3}
.filter-btn:hover{border-color:rgba(255,255,255,.65);color:#fff}
.filter-btn.active{background:#fff;border-color:#fff;color:var(--g)}
.filter-btn.target-btn.active{background:var(--red);border-color:var(--red);color:#fff}
.filter-btn.near-btn.active{background:var(--nrt);border-color:var(--nrt);color:#fff}
.filter-btn.rev-btn.active,.filter-btn.prof-btn.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.6);color:#fff}
.alpha-nav-wrap{position:sticky;top:0;z-index:100;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.alpha-nav{max-width:1140px;margin:0 auto;padding:0 12px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;gap:1px;min-height:46px}
.alpha-nav::-webkit-scrollbar{display:none}
.alpha-btn{font-family:'Montserrat',sans-serif;font-weight:500;font-size:12px;color:var(--mu);background:none;border:none;cursor:pointer;padding:4px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0;transition:color .12s,background .12s;line-height:1}
.alpha-btn:hover:not(.disabled){color:var(--g);background:var(--gl)}
.alpha-btn.active{color:#fff!important;background:var(--g)!important}
.alpha-btn.disabled{color:var(--bd);cursor:default;pointer-events:none}
.alpha-sep{width:1px;height:14px;background:var(--bd);flex-shrink:0;margin:0 4px}
.stats-bar{max-width:1140px;margin:0 auto;padding:18px 28px 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.stats-item{display:flex;align-items:baseline;gap:5px}
.stats-count{font-family:'Montserrat',sans-serif;font-weight:700;font-size:24px;color:var(--g);font-variant-numeric:tabular-nums}
.stats-label{font-size:14px;color:var(--mu)}
.main{max-width:1140px;margin:0 auto;padding:24px 28px 80px}
.no-results{text-align:center;padding:60px 20px;color:var(--mu);font-size:15px}
.letter-section{margin-bottom:38px;scroll-margin-top:56px}
.letter-heading{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid var(--bd)}
.letter-heading-letter{font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:var(--red);line-height:1;min-width:24px}
.letter-total{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;color:var(--mu)}
.company-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-width:0}.company-card{min-width:0}
@media(max-width:900px){.company-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.company-grid{grid-template-columns:1fr}}
.company-card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:13px 15px;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,box-shadow .15s,transform .12s;position:relative;overflow:hidden}
.company-card:hover{border-color:var(--g2);box-shadow:0 4px 16px rgba(27,60,40,.09);transform:translateY(-1px)}
.company-card.is-target{border-left:3px solid var(--tgt)}
.company-card.has-deal{border-color:#1a7340;border-width:2px}
.company-card.has-deal:hover{border-color:#1a7340;box-shadow:0 4px 16px rgba(27,60,40,.18)}
.company-card.has-reject{border-color:#c0392b;border-width:2px;opacity:.75}
.company-card.has-reject:hover{border-color:#c0392b;opacity:1}
.company-card.is-target::before{content:'';position:absolute;bottom:0;left:0;width:0;height:0;border-style:solid;border-width:0 0 10px 10px;border-color:transparent transparent var(--tgt) transparent}
.company-name{font-family:'Montserrat',sans-serif;font-weight:600;font-size:13px;color:var(--tx);line-height:1.3}
.company-country{font-size:11px;color:var(--mu);margin-top:1px}
.company-cat{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);background:var(--lb);border-radius:3px;padding:1px 5px;margin-top:3px;align-self:flex-start;line-height:1.5}
.company-brief{font-size:12px;color:var(--mu);line-height:1.35;overflow-wrap:break-word;word-break:break-word}
.company-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
.company-city{font-size:11px;color:var(--mu)}
.near-badge{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;color:#fff;background:var(--nrt);padding:1px 5px;border-radius:2px;letter-spacing:.03em;align-self:flex-start;margin-bottom:2px}
.target-badge{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;color:#fff;background:var(--tgt);padding:1px 5px;border-radius:2px;letter-spacing:.03em;align-self:flex-start;margin-bottom:2px}
.filter-hint{font-size:12px;color:var(--mu);background:var(--lb);border-radius:6px;padding:7px 12px;margin:0 0 8px;line-height:1.45}
.catalog-link{font-size:10px;font-weight:600;color:var(--g2);text-decoration:none;padding:2px 7px;border:1px solid var(--g2);border-radius:3px;opacity:.75;white-space:nowrap;line-height:1.4}.catalog-link:hover{opacity:1;background:var(--g2);color:#fff}
.card-fin{margin-top:7px;border-top:1px solid var(--bd);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.card-fin-row{display:flex;justify-content:space-between;align-items:baseline}
.fin-label{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx);opacity:.55}
.fin-value{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.fin-value.loss{color:var(--red)}
.fin-year{font-size:10px;color:var(--mu)}
.card-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);flex-wrap:wrap}
.card-deal-btn{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;color:#fff;background:var(--g);padding:4px 10px;border-radius:4px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;line-height:1.4;transition:opacity .15s;white-space:nowrap}
.card-deal-btn:hover{opacity:.82}
.card-site-link{font-family:'Montserrat',sans-serif;font-size:11px;color:var(--mu);border:1px solid var(--bd);padding:3px 9px;border-radius:4px;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.card-site-link:hover{border-color:var(--g2);color:var(--tx)}
.card-audio-btn{font-family:'Montserrat',sans-serif;font-size:11px;color:var(--mu);background:none;border:1px solid var(--bd);padding:3px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.card-audio-btn:hover{border-color:var(--g2);color:var(--tx)}
@keyframes rec-pulse{0%,100%{opacity:1}50%{opacity:.5}}
#notePopup{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center}
#notePopup.open{display:flex}
#notePopupBack{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#notePopupBox{position:relative;background:var(--sf);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 16px 36px;box-shadow:0 -4px 32px rgba(0,0,0,.18);max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
@media(min-width:560px){#notePopupBox{border-radius:12px;margin:auto;max-height:80vh}}
#notePopupHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
#notePopupTitle{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:var(--tx);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#notePopupClose{background:none;border:none;font-size:20px;color:var(--mu);cursor:pointer;padding:0 2px;line-height:1}
.popup-divider{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.popup-notes{display:flex;flex-direction:column;gap:6px}
.popup-note-item{background:var(--lb);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--tx);line-height:1.5}
.popup-note-time{font-size:10px;color:var(--mu);margin-top:4px}
#notePopupText{width:100%;box-sizing:border-box;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--tx);background:var(--bg);resize:none;height:80px;font-family:inherit;outline:none;line-height:1.5}
#notePopupText:focus{border-color:var(--g2)}
#notePopupBtns{display:flex;gap:8px}
#notePopupMic{flex:0 0 auto;font-family:'Montserrat',sans-serif;font-size:12px;background:none;border:1px solid var(--bd);border-radius:6px;padding:8px 14px;cursor:pointer;color:var(--mu);white-space:nowrap}
#notePopupMic:hover{border-color:var(--g2);color:var(--tx)}
#notePopupMic.recording{color:#c0392b;border-color:#c0392b;animation:rec-pulse 1s ease-in-out infinite}
#notePopupSave{flex:1;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;background:var(--g);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer}
#notePopupSave:disabled{opacity:.5;cursor:default}
.card-reject-btn{font-family:'Montserrat',sans-serif;font-size:11px;color:#c0392b;background:none;border:1px solid #f5c6cb;padding:3px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.card-reject-btn:hover{background:#fff0f0}
.card-unreject-btn{font-family:'Montserrat',sans-serif;font-size:11px;color:#888;background:none;border:1px solid #ddd;padding:3px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.card-unreject-btn:hover{border-color:#aaa;color:var(--tx)}
.company-desc{font-size:12px;color:var(--mu);line-height:1.45;margin-top:3px}
.card-notes{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.card-note-item{font-size:11px;color:var(--tx);line-height:1.45;background:var(--lb);border-radius:4px;padding:5px 8px;border-left:2px solid var(--g2)}
.card-status-badge{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:2px;align-self:flex-start;margin-bottom:2px;text-transform:uppercase}
.card-status-badge.status-deal{background:#1a7340;color:#fff}
.card-status-badge.status-note{background:#e67e22;color:#fff}
.card-status-badge.status-reject{background:#888;color:#fff}
.site-footer{background:var(--g);color:rgba(255,255,255,.5);text-align:center;padding:18px 16px;font-family:'Montserrat',sans-serif;font-size:12px}
.site-footer strong{color:rgba(255,255,255,.85)}
@media(max-width:600px){
  .site-header{padding:10px 16px}
  .header-info{display:none}
  .hero{padding:20px 14px 36px}
  .hero-wave{margin-left:-2px;margin-right:-2px}
  .hero-row{flex-direction:column;gap:8px}
  .search-box{max-width:100%;min-width:0}
  .search-box input{font-size:16px}
  .filters-group{width:100%}
  .filter-btn{font-size:11px;padding:5px 10px}
  .stats-bar,.main{padding-left:14px;padding-right:14px}
  .alpha-btn{font-size:10px;padding:3px 5px}
  .company-grid{gap:8px}
  .company-card{padding:11px 12px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.company-card{transition:none}}
</style>

  <a class="logo" href="#">L<em>S</em>F</a>

</header>

  <div class="hero-inner">

<script>
const EX = {{EX_JSON}};

const TOTAL = EX.length;
const NOTES_API = 'https://flexi-telegram-deal-bot.skillset-apply.workers.dev/api/site-predeal-notes';
const EVENT_KEY = '{{EVENT_KEY}}';
const CATALOG_BASE = '{{CATALOG_BASE}}';

let fMain='all', fRev='all', fProf='all', fSearch='';
const statusByCompany = new Map();

function notesApiEnabled(){ return !['localhost','127.0.0.1'].includes(location.hostname); }

function loadFilters(){try{const s=JSON.parse(localStorage.getItem('{{EVENT_KEY}}_filters')||'{}');fMain=s.fMain||'all';fRev=s.fRev||'all';fProf=s.fProf||'all';}catch(e){}}
function saveFilters(){try{localStorage.setItem('{{EVENT_KEY}}_filters',JSON.stringify({fMain,fRev,fProf}));}catch(e){}}

function getSiteUrl(w,email){
  if(w) try{return new URL(w.startsWith('http')?w:'https://'+w).href;}catch(e){}
  if(email){const d=email.split('@')[1];if(d) return 'https://'+d;}
  return '';
}
function siteName(url){try{return new URL(url).hostname.replace(/^www\./,'');}catch(e){return'Сайт';}}
function siteLink(w,email){const u=getSiteUrl(w,email);return u?'<a class="card-site-link" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(siteName(u))+'</a>':''}

function companyStatus(id){
  const info=statusByCompany.get(String(id));
  if(!info) return null;
  if(info.hasDeal) return 'deal';
  if(info.rejected) return 'reject';
  if(info.notes&&info.notes.length>0) return 'note';
  return null;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function plural(n,one,two,five){const m=n%10,h=n%100;if(h>=11&&h<=19)return five;if(m===1)return one;if(m>=2&&m<=4)return two;return five;}
function fmtRev(v){
  if(v==null) return '';
  if(v>=1000) return (v/1000).toFixed(1).replace(/\.0$/,'')+'&nbsp;млрд';
  return v+'&nbsp;млн';
}

async function saveNote(id,name,stand,text){
  const f=new FormData();f.append('eventKey',EVENT_KEY);f.append('companyId',id);f.append('companyName',name);f.append('stand',stand);f.append('hall','{{EXPO_TITLE}}');f.append('noteText',text);
  const r=await fetch(NOTES_API,{method:'POST',body:f}); const p=await r.json().catch(()=>({}));
  if(p.ok){const info=statusByCompany.get(String(id))||{};info.notes=[...(info.notes||[]),{text,ts:Date.now()}];statusByCompany.set(String(id),info);render();}
}
async function rejectCompany(id,name,stand){
  const f=new FormData();f.append('eventKey',EVENT_KEY);f.append('companyId',id);f.append('companyName',name);f.append('stand',stand);f.append('hall','{{EXPO_TITLE}}');f.append('statusAction','reject');
  const r=await fetch(NOTES_API,{method:'POST',body:f}); const p=await r.json().catch(()=>({}));
  if(p.ok){const info=statusByCompany.get(String(id))||{};info.rejected=true;statusByCompany.set(String(id),info);render();}
}
async function unrejectCompany(id,name,stand){
  const f=new FormData();f.append('eventKey',EVENT_KEY);f.append('companyId',id);f.append('companyName',name);f.append('stand',stand);f.append('hall','{{EXPO_TITLE}}');f.append('statusAction','unreject');
  const r=await fetch(NOTES_API,{method:'POST',body:f}); const p=await r.json().catch(()=>({}));
  if(p.ok){const info=statusByCompany.get(String(id))||{};info.rejected=false;statusByCompany.set(String(id),info);render();}
}

async function loadStatuses(){
  if(!notesApiEnabled()) return;
  const allIds=EX.map(e=>e.id);
  const BATCH=100;
  let changed=false;
  for(let i=0;i<allIds.length;i+=BATCH){
    const ids=allIds.slice(i,i+BATCH);
    try{
      const r=await fetch(NOTES_API+'?eventKey='+encodeURIComponent(EVENT_KEY)+'&companyIds='+encodeURIComponent(ids.join(',')));
      if(!r.ok) continue;
      const p=await r.json();
      Object.entries(p.companies||{}).forEach(([id,info])=>{statusByCompany.set(String(id),info);changed=true;});
    }catch(err){console.warn('note status unavailable',err);break;}
  }
  if(changed) render();
}

function getLetterKey(name){
  if(!name) return '#';
  // Normalize: get first char
  const ch=name.replace(/^["\'«]*/,'')[0]||'#';
  const up=ch.toUpperCase();
  if(/[A-Z]/.test(up)) return up;
  // Cyrillic А-Я
  if(/[А-ЯЁ]/.test(up)) return up;
  return '#';
}

function inRev(e){
  if(fRev==='all') return true;
  const v=e.rev; if(v==null) return false;
  if(fRev==='0-100') return v<100;
  if(fRev==='100-1500') return v>=100&&v<=1500;
  if(fRev==='1500+') return v>1500;
  return true;
}
function inProf(e){
  if(fProf==='all') return true;
  const v=e.prof; if(v==null) return false;
  if(fProf==='loss') return v<0;
  if(fProf==='0-30') return v>=0&&v<30;
  if(fProf==='30-200') return v>=30&&v<200;
  if(fProf==='200+') return v>=200;
  return true;
}
function isNear(e){return e.nt===1;}
function updateFilterHint(){
  const h=document.getElementById('filterHint');
  if(!h) return;
  const parts=[];
  const MAIN={'target':'<b>Целевые</b> — российские производители с выручкой 150M–1B₽ (любая прибыль) или 1B–5B₽ при прибыли ≤100M (Сколково).','near':'<b>Почти целевые</b> — российские производители с неизвестной выручкой, &lt;150M или &gt;5B₽; либо статус производителя требует уточнения.','ru':'<b>Россия</b> — только компании, зарегистрированные в РФ.'};
  const REV={'0-100':'Выручка <b>до 100M</b> — ниже порога целевых (150M). Показаны для справки.','100-1500':'Выручка <b>100–1500M</b> — охватывает основной диапазон целевых (150–1000M).','1500+':'Выручка <b>от 1,5B</b> — крупные компании. Целевые только при прибыли ≤100M и выручке до 5B.'};
  const PROF={'loss':'Прибыль: <b>убыток</b> — при выручке 150M–5B такие компании всё равно целевые.','0-30':'Прибыль <b>0–30M</b> — малоприбыльные компании.','30-200':'Прибыль <b>30–200M</b> — при выручке 1–5B прибыль выше 100M выводит из целевых.','200+':'Прибыль <b>&gt;200M</b> — как правило уже работают с крупными консультантами, не наши клиенты.'};
  if(MAIN[fMain]) parts.push(MAIN[fMain]);
  if(REV[fRev]) parts.push(REV[fRev]);
  if(PROF[fProf]) parts.push(PROF[fProf]);
  if(parts.length){h.innerHTML=parts.join('<br>');h.hidden=false;}
  else{h.hidden=true;}
}
function getFiltered(){
  let list=EX;
  if(fMain==='ru') list=list.filter(e=>e.ru===1);
  if(fMain==='target') list=list.filter(e=>e.t===1);
  if(fMain==='near') list=list.filter(isNear);
  list=list.filter(e=>inRev(e)&&inProf(e));
  if(fSearch){const q=fSearch.toLowerCase(); list=list.filter(e=>e.n.toLowerCase().includes(q)||e.cat.toLowerCase().includes(q)||(e.country||'').toLowerCase().includes(q));}
  return list;
}

// Cyrillic sort order for letters
const CYR_ORDER='АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
function letterOrder(k){
  if(k==='#') return 9999;
  const ci=CYR_ORDER.indexOf(k);
  if(ci>=0) return 1000+ci;
  return k.charCodeAt(0);
}

function render(){
  const list=getFiltered();
  const cat=document.getElementById('catalog');
  document.getElementById('visibleCount').textContent=list.length;
  const isFiltered=fMain!=='all'||fRev!=='all'||fProf!=='all'||fSearch;
  document.getElementById('visibleLabel').textContent=isFiltered?'из '+TOTAL:'участников';
  updateFilterHint();

  if(!list.length){
    cat.innerHTML='<div class="no-results">Ничего не найдено. <a href="#" id="resetFilters" style="color:var(--g2)">Сбросить фильтры</a></div>';
    document.getElementById('resetFilters')?.addEventListener('click',e=>{e.preventDefault();fMain='all';fRev='all';fProf='all';fSearch='';document.getElementById('searchInput').value='';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));document.querySelectorAll('[data-rev]').forEach(b=>b.classList.toggle('active',b.dataset.rev==='all'));document.querySelectorAll('[data-prof]').forEach(b=>b.classList.toggle('active',b.dataset.prof==='all'));saveFilters();render();});
    updateNav({});return;
  }

  const groups={};
  list.forEach(e=>{
    const k=getLetterKey(e.n);
    if(!groups[k]) groups[k]=[];
    groups[k].push(e);
  });
  const orderedKeys=Object.keys(groups).sort((a,b)=>letterOrder(a)-letterOrder(b));

  updateNav(groups,orderedKeys);
  cat.innerHTML='';
  orderedKeys.forEach(key=>{
    const sec=document.createElement('section');
    sec.className='letter-section'; sec.id='sec-'+key;
    const entries=groups[key];
    sec.innerHTML='<div class="letter-heading"><span class="letter-heading-letter">'+key+'</span><span class="letter-total">'+entries.length+' '+plural(entries.length,'участник','участника','участников')+'</span></div>';
    const grid=document.createElement('div'); grid.className='company-grid';
    entries.forEach(e=>{
      const card=document.createElement('div');
      const st=companyStatus(e.id);
      card.className='company-card'+(e.t?' is-target':'')+(st?' has-'+st:'');
      const stLabel={'deal':'сделка','note':'заметка','reject':'отказ'}[st]||'';
      let html=(stLabel?'<span class="card-status-badge status-'+st+'">'+stLabel+'</span>':'')+
        (e.t?'<span class="target-badge">ЦЕЛЕВАЯ</span>':'')+(isNear(e)?'<span class="near-badge">ИНТЕРЕС</span>':'')+
        '<div class="company-name">'+esc(e.n)+'</div>'+
        (e.ru===0&&e.country?'<div class="company-country">'+esc(e.country)+'</div>':'')+
        (e.cat?'<div class="company-cat">'+esc(e.cat)+'</div>':'')+
        (e.b?'<div class="company-desc">'+esc(e.b)+'</div>':'')+
        '<div class="company-meta">'+
          (e.ogrn?'<a class="catalog-link" href="https://checko.ru/company/'+esc(e.ogrn)+'" target="_blank" rel="noopener">Checko</a>':'ИНН не найден')+
          (CATALOG_BASE&&e.href?' <a class="catalog-link" href="'+CATALOG_BASE+esc(e.href)+'" target="_blank" rel="noopener">Профиль</a>':'')+
          (e.w?' <a class="catalog-link" href="'+esc(getSiteUrl(e.w,''))+'" target="_blank" rel="noopener">Сайт</a>':'')+
        '</div>';
      if(e.rev!=null){
        const profColor=e.prof!=null&&e.prof<0?' loss':'';
        const profStr=e.prof!=null?('<div class="card-fin-row"><span class="fin-label">Прибыль</span><span class="fin-value'+profColor+'">'+fmtRev(Math.abs(e.prof))+(e.prof<0?' убыток':'')+'</span><span class="fin-year">'+e.py+'</span></div>'):'';
        html+='<div class="card-fin">'+
          '<div class="card-fin-row"><span class="fin-label">Выручка</span><span class="fin-value">'+fmtRev(e.rev)+'</span><span class="fin-year">'+e.ry+'</span></div>'+
          profStr+'</div>';
      }
      const cardNotes=(statusByCompany.get(String(e.id))||{}).notes||[];
      if(cardNotes.length){html+='<div class="card-notes">'+cardNotes.map(n=>'<div class="card-note-item">'+esc((n.text||'').substring(0,150))+((n.text||'').length>150?'…':'')+'</div>').join('')+'</div>';}
      const tgPayload=encodeURIComponent(EVENT_KEY+'_deal_'+e.id);
      const tgLink='https://t.me/cmr_management_bot?start='+tgPayload;
      const canReject=st!=='reject'&&st!=='deal';
      const isRejected=st==='reject';
      html+='<div class="card-actions">'+
        '<a class="card-deal-btn" href="'+tgLink+'" target="_blank" rel="noopener">✈ Создать сделку</a>'+
        '<button class="card-audio-btn" type="button" data-cid="'+esc(e.id)+'" data-cn="'+esc(e.n)+'" data-cs="">🎙 Заметка</button>'+
        (canReject?'<button class="card-reject-btn" type="button" data-cid="'+esc(e.id)+'" data-cn="'+esc(e.n)+'" data-cs="">Отказ</button>':'')+
        (isRejected?'<button class="card-unreject-btn" type="button" data-cid="'+esc(e.id)+'" data-cn="'+esc(e.n)+'" data-cs="">↩ Отменить</button>':'')+
        siteLink(e.w,null)+
        '</div>';
      card.innerHTML=html;
      grid.appendChild(card);
    });
    sec.appendChild(grid); cat.appendChild(sec);
  });
  initObs();
  attachCardListeners();
}

function updateNav(groups,orderedKeys){
  const nav=document.getElementById('alphaNav'); nav.innerHTML='';
  (orderedKeys||[]).forEach((k,i)=>{
    if(i>0){const sep=document.createElement('span');sep.className='alpha-sep';nav.appendChild(sep);}
    const b=document.createElement('button');
    b.className='alpha-btn'+(groups[k]?'':' disabled');
    b.textContent=k==='#'?'#':k; b.dataset.key=k;
    if(groups[k]) b.addEventListener('click',()=>document.getElementById('sec-'+k)?.scrollIntoView({behavior:'smooth',block:'start'}));
    nav.appendChild(b);
  });
}

let obs;
function initObs(){
  if(obs) obs.disconnect();
  obs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const k=en.target.id.replace('sec-','');
        document.querySelectorAll('.alpha-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===k));
        document.querySelector('.alpha-btn.active')?.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
      }
    });
  },{rootMargin:'-50px 0px -60% 0px'});
  document.querySelectorAll('.letter-section').forEach(s=>obs.observe(s));
}

function attachCardListeners(){
  document.getElementById('catalog').addEventListener('click',function(ev){
    const t=ev.target;
    if(t.matches('.card-audio-btn')){openNotePopup(t.dataset.cid,t.dataset.cn,t.dataset.cs);}
    if(t.matches('.card-reject-btn')){if(confirm('Отметить как отказ: '+t.dataset.cn+'?')) rejectCompany(t.dataset.cid,t.dataset.cn,t.dataset.cs);}
    if(t.matches('.card-unreject-btn')){unrejectCompany(t.dataset.cid,t.dataset.cn,t.dataset.cs);}
  });
}

let currentNoteId=null,currentNoteName=null,currentNoteStand=null;
function openNotePopup(id,name,stand){
  currentNoteId=id;currentNoteName=name;currentNoteStand=stand;
  document.getElementById('notePopupTitle').textContent=name;
  document.getElementById('notePopupNotes').innerHTML='';
  document.getElementById('notePopupText').value='';
  document.getElementById('notePopup').classList.add('open');
  if(notesApiEnabled()){
    fetch(NOTES_API+'?eventKey='+encodeURIComponent(EVENT_KEY)+'&companyId='+encodeURIComponent(id))
      .then(r=>r.json()).then(p=>{
        const notes=(p.company||{}).notes||[];
        const div=document.getElementById('notePopupNotes');
        if(notes.length){
          div.innerHTML='<div class="popup-divider">Заметки</div><div class="popup-notes">'+
            notes.map(n=>'<div class="popup-note-item">'+esc(n.text||'')+'<div class="popup-note-time">'+(n.ts?new Date(n.ts).toLocaleString('ru'):'')+'</div></div>').join('')+'</div>';
        }
      }).catch(()=>{});
  }
}
function closeNotePopup(){document.getElementById('notePopup').classList.remove('open');stopRecording();}

let mediaRec=null,recChunks=[];
function stopRecording(){
  if(mediaRec&&mediaRec.state!=='inactive'){mediaRec.stop();}
  mediaRec=null;recChunks=[];
  const btn=document.getElementById('notePopupMic');
  btn.textContent='🎙 Записать';btn.classList.remove('recording');
}

document.getElementById('notePopupMic').addEventListener('click',async function(){
  if(mediaRec&&mediaRec.state==='recording'){
    mediaRec.stop();return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];
    mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>recChunks.push(e.data);
    mediaRec.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(recChunks,{type:'audio/webm'});
      const btn=document.getElementById('notePopupMic');
      btn.textContent='🎙 Записать';btn.classList.remove('recording');
      const fd=new FormData();fd.append('file',blob,'audio.webm');fd.append('model','whisper-1');fd.append('language','ru');
      btn.textContent='⏳ Распознаю...';btn.disabled=true;
      try{
        const resp=await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+((window._openaiKey)||'')},body:fd});
        const d=await resp.json();
        if(d.text){const ta=document.getElementById('notePopupText');ta.value=(ta.value?ta.value+' ':'')+d.text;}
      }catch(e2){console.warn('transcription failed',e2);}finally{btn.textContent='🎙 Записать';btn.disabled=false;}
    };
    mediaRec.start();
    this.textContent='⏹ Стоп';this.classList.add('recording');
  }catch(e){alert('Микрофон недоступен: '+e.message);}
});

document.getElementById('notePopupSave').addEventListener('click',async function(){
  const text=document.getElementById('notePopupText').value.trim();
  if(!text||!currentNoteId) return;
  this.disabled=true;
  try{await saveNote(currentNoteId,currentNoteName,currentNoteStand,text);}finally{this.disabled=false;}
  closeNotePopup();
});

document.getElementById('notePopupClose').addEventListener('click',closeNotePopup);
document.getElementById('notePopupBack').addEventListener('click',closeNotePopup);
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeNotePopup();});

document.getElementById('searchInput').addEventListener('input',function(){fSearch=this.value.trim();render();});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',function(){
  fMain=this.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===this));
  saveFilters();render();
}));
document.querySelectorAll('[data-rev]').forEach(b=>b.addEventListener('click',function(){
  fRev=this.dataset.rev;
  document.querySelectorAll('[data-rev]').forEach(x=>x.classList.toggle('active',x===this));
  saveFilters();render();
}));
document.querySelectorAll('[data-prof]').forEach(b=>b.addEventListener('click',function(){
  fProf=this.dataset.prof;
  document.querySelectorAll('[data-prof]').forEach(x=>x.classList.toggle('active',x===this));
  saveFilters();render();
}));

loadFilters();
render();
loadStatuses();
</script>
