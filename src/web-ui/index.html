<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Assistant</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

  <!-- Loading -->
  <div id="view-loading" style="padding:48px 0;text-align:center">
    <div class="loading" style="justify-content:center">
      <div class="spinner"></div> Loading…
    </div>
  </div>

  <div class="shell hidden" id="shell">

    <!-- Sidebar: session list -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="nav-title">Claude Assistant</span>
        <button class="btn btn-ghost" id="btn-logout" data-testid="btn-logout">Logout</button>
      </div>
      <button class="btn btn-primary btn-block" id="btn-new" data-testid="btn-new">+ New</button>


      <div class="sidebar-section-title">Sessions</div>
      <div id="sessions-list" class="sessions-list"></div>
    </aside>

    <!-- Main: active session (or the new-task welcome state) -->
    <main class="main">
      <div class="main-header">
        <span class="nav-title" id="session-title">New session</span>
        <button class="btn btn-danger hidden" id="btn-stop" data-testid="btn-stop">Stop</button>
      </div>

      <div id="messages-container" class="messages hidden"></div>
      <div id="empty-state" class="empty">
        <h3>Start a new session</h3>
        <p>Describe a task below, or pick a session from the list</p>
      </div>
      <div id="stream-area" class="stream-area hidden"></div>
      <div id="reconnect-notice" class="reconnect-notice hidden">Reconnecting…</div>

      <!-- Unified composer: creates a session (state A) or replies in one (state B) -->
      <div class="composer" id="composer" data-testid="composer">
        <div class="composer-row" id="composer-project-row">
          <select id="folder-select" data-testid="folder-select">
            <option value="">Loading folders…</option>
          </select>
        </div>
        <textarea id="composer-input" rows="2" data-testid="composer-input" placeholder="Опиши задачу…"></textarea>
        <div class="composer-actions">
          <input type="file" id="file-input" class="hidden" multiple data-testid="file-input">
          <button type="button" class="btn btn-icon" id="btn-attach" title="Attach file" data-testid="btn-attach">📎</button>
          <button type="button" class="btn btn-icon" id="btn-voice" title="Voice input" data-testid="btn-voice">🎙</button>
          <button type="button" class="btn btn-primary" id="btn-composer-submit" data-testid="btn-composer-submit">Start</button>
        </div>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
