# RU VM only. Install after provisioning the apex + www certificate.
# Keep platform.recruiter-assistant.ru unchanged for existing links.
server {
    listen 80;
    server_name recruiter-assistant.ru www.recruiter-assistant.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    location / { return 308 https://recruiter-assistant.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.recruiter-assistant.ru;
    ssl_certificate /etc/letsencrypt/live/recruiter-assistant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruiter-assistant.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://recruiter-assistant.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name recruiter-assistant.ru;
    ssl_certificate /etc/letsencrypt/live/recruiter-assistant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruiter-assistant.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location = / { return 302 /web/$is_args$args; }

    # OAuth state belongs to the existing GCP process. Route both start and
    # callback there, preserving every parameter and the registered redirect URI.
    location = /connect/hh {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        return 307 https://136-65-7-197.sslip.io$request_uri;
    }
    location ^~ /connect/hh/ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        return 307 https://136-65-7-197.sslip.io$request_uri;
    }
    location = /hh-callback {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        return 307 https://136-65-7-197.sslip.io$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
