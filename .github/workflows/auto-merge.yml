name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  wait-merge-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          STATUS="PENDING"
          for i in $(seq 1 60); do
            RUN=$(gh run list --branch "$BRANCH" --workflow ci.yml --limit 1 \
              --json status,conclusion 2>/dev/null || echo "[]")
            RUN_STATUS=$(echo "$RUN" | jq -r '.[0].status // "queued"')
            RUN_CONCL=$(echo "$RUN"  | jq -r '.[0].conclusion // ""')
            if [ "$RUN_STATUS" = "completed" ]; then
              STATUS=$(echo "$RUN_CONCL" | tr '[:lower:]' '[:upper:]')
            else
              STATUS="PENDING"
            fi
            echo "Attempt $i: run_status=$RUN_STATUS conclusion=$RUN_CONCL → $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then break; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "CI did not pass — skipping merge"; exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "SUCCESS" ]; then echo "Timed out waiting for CI"; exit 1; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash-merge the PR
        run: gh pr merge --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/vova/trained-assist-agent
            git fetch origin main
            git reset --hard origin/main
            printf 'INN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\n' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            bash scripts/deploy.sh

      - name: Deploy to RU VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_RU_HOST }}
          username: ${{ secrets.VM_RU_USER }}
          password: ${{ secrets.VM_RU_PASSWORD }}
          script: |
            git config --global --add safe.directory /home/vova/trained-assist-agent
            cd /home/vova/trained-assist-agent
            git fetch origin main
            git reset --hard origin/main
            printf 'TELEGRAM_BOT_TOKEN=%s\nANTHROPIC_API_KEY=%s\nAGENT_SECRET=%s\nDEEPGRAM_API_KEY=%s\nBOT_SECRET=%s\nAGENT_PUBLIC_URL=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\n' \
              '${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              '${{ secrets.ANTHROPIC_API_KEY }}' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.DEEPGRAM_API_KEY }}' \
              '${{ secrets.BOT_SECRET }}' \
              'https://178-212-14-192.sslip.io' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            AGENT_SECRET="${{ secrets.AGENT_SECRET }}" bash scripts/deploy.sh
