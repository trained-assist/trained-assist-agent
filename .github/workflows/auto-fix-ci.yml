name: Auto-fix CI failure

on:
  workflow_run:
    workflows: ["CI + Deploy"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          # Never auto-fix a fix/ci-* branch — that would create an infinite loop
          if [[ "$BRANCH" == fix/ci-* ]]; then
            echo "Failing branch $BRANCH is itself a CI-fix branch — not creating another fix" >&2
            exit 1
          fi

          PR_NUMBER=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list -R "${{ github.repository }}" --head "$BRANCH" --json number -q '.[0].number')
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR found for branch $BRANCH, skipping." >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Guard against duplicate fix PRs
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.pr.outputs.branch }}"
          # Sanitize branch name the same way the script does
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-40)

          # Check if there's already an open fix PR for this source branch
          EXISTING=$(gh pr list -R "${{ github.repository }}" \
            --json number,headRefName --state open \
            | jq -r ".[] | select(.headRefName | startswith(\"fix/ci-${SAFE_BRANCH}-\")) | .number" \
            | head -1)

          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already have an open fix PR #$EXISTING for branch $BRANCH — skipping to avoid duplicates." >&2
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: 3-stage auto-fix (OpenRouter free models)
        id: autofix
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ORIGINAL_BRANCH: ${{ steps.pr.outputs.branch }}
        run: node scripts/autofix-openrouter.mjs

      - name: Upload stats artifact
        if: steps.guard.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fixer-stats-pr${{ steps.pr.outputs.number }}-run${{ github.run_id }}
          path: ci-fixer-stats.json
          if-no-files-found: ignore
          retention-days: 90
