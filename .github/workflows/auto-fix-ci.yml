name: Auto-fix CI failure

on:
  workflow_run:
    workflows: ["CI + Deploy"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list -R "${{ github.repository }}" --head "${{ github.event.workflow_run.head_branch }}" --json number -q '.[0].number')
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR found for branch ${{ github.event.workflow_run.head_branch }}, skipping." >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Guard against retry loops
        id: guard
        run: |
          if git log -3 --pretty=%B | grep -qi '\[autofix\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Last commits already contain an [autofix] attempt on this branch — stopping to avoid a loop." >&2
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: 3-stage auto-fix (OpenRouter free models)
        id: autofix
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Override any stage model via repo secrets (optional):
          # STAGE1_MODEL: deepseek/deepseek-r1:free       (diagnosis)
          # STAGE2_MODEL: google/gemini-2.5-flash-lite-preview-06-17:free  (context, needs large ctx)
          # STAGE3_MODEL: qwen/qwen3-235b-a22b:free       (patch writing)
          STAGE1_MODEL: ${{ secrets.AUTOFIX_STAGE1_MODEL }}
          STAGE2_MODEL: ${{ secrets.AUTOFIX_STAGE2_MODEL }}
          STAGE3_MODEL: ${{ secrets.AUTOFIX_STAGE3_MODEL }}
        run: node scripts/autofix-openrouter.mjs

      - name: Report unfixed failure
        if: steps.guard.outputs.skip == 'false' && steps.autofix.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} -R ${{ github.repository }} --body \
            "🤖 3-stage auto-fix pipeline could not resolve the failure in run ${{ github.event.workflow_run.id }}. Needs a human look."
