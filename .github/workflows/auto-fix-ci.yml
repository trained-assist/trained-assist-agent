name: Auto-fix CI failure

on:
  workflow_run:
    workflows: ["CI + Deploy"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list -R "${{ github.repository }}" --head "${{ github.event.workflow_run.head_branch }}" --json number -q '.[0].number')
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR found for branch ${{ github.event.workflow_run.head_branch }}, skipping." >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Guard against retry loops
        id: guard
        run: |
          if git log -3 --pretty=%B | grep -qi '\[autofix\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Last commits already contain an [autofix] attempt on this branch — stopping to avoid a loop." >&2
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cheap-model auto-fix attempt (OpenRouter)
        id: openrouter
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MODEL: deepseek/deepseek-chat
        run: node scripts/autofix-openrouter.mjs

      - name: Strong-model auto-fix attempt (OpenRouter fallback)
        id: openrouter-strong
        if: steps.guard.outputs.skip == 'false' && steps.openrouter.outcome != 'success'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MODEL: qwen/qwen3-coder
          MAX_ATTEMPTS: 3
        run: node scripts/autofix-openrouter.mjs

      - name: Report unfixed failure
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.openrouter.outcome != 'success' &&
          steps.openrouter-strong.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} -R ${{ github.repository }} --body \
            "🤖 Auto-fix could not confidently resolve the failure in run ${{ github.event.workflow_run.id }} (tried \`deepseek/deepseek-chat\` then \`qwen/qwen3-coder\` via OpenRouter). Needs a human look."
