name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Env-sync check
        run: node scripts/check-env-sync.js

  merge:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge the PR
        run: gh pr merge --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after PR auto-merge OR on direct push to main (e.g. GitHub UI squash-merge).
  # always() lets the job run even when `merge` was skipped (merge only runs on PRs).
  deploy-gcp:
    needs: [ci, merge]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.merge.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/vova/trained-assist-agent
            git fetch origin main
            git reset --hard origin/main
            printf 'AGENT_SECRET=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\nOPENAI_API_KEY=%s\nFAL_KEY=%s\nIDEOGRAM_API_KEY=%s\nRECRAFT_API_KEY=%s\nGIGACHAT_API_KEY=%s\n' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.FAL_KEY }}' \
              '${{ secrets.IDEOGRAM_API_KEY }}' \
              '${{ secrets.RECRAFT_API_KEY }}' \
              '${{ secrets.GIGACHAT_API_KEY }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            bash scripts/deploy.sh

  deploy-ru:
    needs: [ci, merge]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.merge.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to RU VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_RU_HOST }}
          username: ${{ secrets.VM_RU_USER }}
          password: ${{ secrets.VM_RU_PASSWORD }}
          script: |
            git config --global --add safe.directory /home/vova/trained-assist-agent
            cd /home/vova/trained-assist-agent
            git fetch origin main
            git reset --hard origin/main
            printf 'TELEGRAM_BOT_TOKEN=%s\nANTHROPIC_API_KEY=%s\nAGENT_SECRET=%s\nDEEPGRAM_API_KEY=%s\nBOT_SECRET=%s\nAGENT_PUBLIC_URL=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\nOPENAI_API_KEY=%s\nFAL_KEY=%s\nIDEOGRAM_API_KEY=%s\nRECRAFT_API_KEY=%s\nGIGACHAT_API_KEY=%s\n' \
              '${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              '${{ secrets.ANTHROPIC_API_KEY }}' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.DEEPGRAM_API_KEY }}' \
              '${{ secrets.BOT_SECRET }}' \
              'https://178-212-14-192.sslip.io' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.FAL_KEY }}' \
              '${{ secrets.IDEOGRAM_API_KEY }}' \
              '${{ secrets.RECRAFT_API_KEY }}' \
              '${{ secrets.GIGACHAT_API_KEY }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            AGENT_SECRET="${{ secrets.AGENT_SECRET }}" bash scripts/deploy.sh
