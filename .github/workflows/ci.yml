name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test

  deploy-gcp:
    runs-on: ubuntu-latest
    needs: ci
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/vova/trained-assist-agent
            git fetch origin main
            git reset --hard origin/main
            # Write INN secrets to secrets.env (main secrets come from GCP Secret Manager)
            printf 'INN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\n' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            bash scripts/deploy.sh

  smoke-gcp:
    runs-on: ubuntu-latest
    needs: deploy-gcp
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - uses: actions/checkout@v4
      - name: Post-deploy smoke test (GCP)
        env:
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          echo "Waiting for service to be healthy (up to 60s)..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $AGENT_SECRET" \
              "https://136-65-7-197.sslip.io/agent/health" 2>/dev/null || echo 000)
            echo "  attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 5
          done
          AGENT_URL="https://136-65-7-197.sslip.io/agent" \
          AGENT_SECRET="$AGENT_SECRET" \
          bash scripts/smoke-test.sh

  deploy-ru:
    runs-on: ubuntu-latest
    needs: ci
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Deploy to Hostland RU VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_RU_HOST }}
          username: ${{ secrets.VM_RU_USER }}
          password: ${{ secrets.VM_RU_PASSWORD }}
          script: |
            git config --global --add safe.directory /home/vova/trained-assist-agent
            cd /home/vova/trained-assist-agent
            git fetch origin main
            git reset --hard origin/main
            # Write secrets.env for SECRETS_SOURCE=env (non-GCP VM)
            printf 'TELEGRAM_BOT_TOKEN=%s\nANTHROPIC_API_KEY=%s\nAGENT_SECRET=%s\nDEEPGRAM_API_KEY=%s\nBOT_SECRET=%s\nAGENT_PUBLIC_URL=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\n' \
              '${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              '${{ secrets.ANTHROPIC_API_KEY }}' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.DEEPGRAM_API_KEY }}' \
              '${{ secrets.BOT_SECRET }}' \
              'https://178-212-14-192.sslip.io' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            AGENT_SECRET="${{ secrets.AGENT_SECRET }}" bash scripts/deploy.sh
