name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  staging-gate:
    name: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --include=dev
      - name: Replay mandatory user scenarios
        run: npm run test:staging
      - name: Save scenario results and tested revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-results/
          if-no-files-found: warn

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Install Chromium for review page regression
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Env-sync check
        run: node scripts/check-env-sync.js
      - name: No direct connect-pending outside user-tokens.js
        run: |
          if grep -rn "connect-pending" src/ --include="*.js" | grep -v "src/user-tokens.js" | grep -v "src/server.js"; then
            echo "❌ Direct connect-pending usage found outside user-tokens.js — use generateConnectLink() or generateLegacyConnectLink() instead"
            exit 1
          fi
      - name: Recruiter/HH tools must call OpenRouter, not spawn Claude Code
        run: |
          FILES=$(find src/mcp-skills/tools -maxdepth 1 -type f \( -iname "*hh*.js" -o -iname "*recruiter*.js" \))
          if [ -n "$FILES" ] && echo "$FILES" | xargs grep -lE "require\((['\"]).*runner\1\)|spawn\(['\"]claude['\"]" ; then
            echo "❌ recruiter-quick-action MCP tools must call OpenRouter (DeepSeek/Gemini) via their own llmCall()-style helper, never open a Claude Code session — see README.md 'Recruiter/quick-action MCP tools must use cheap LLMs, never Claude Code'"
            exit 1
          fi

  autofix:
    needs: [ci, staging-gate]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      (needs.ci.result == 'failure' || needs.staging-gate.result == 'failure') &&
      !startsWith(github.head_ref, 'fix/ci-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Guard against duplicate fix PRs
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-40)
          EXISTING=$(gh pr list -R "${{ github.repository }}" \
            --json number,headRefName --state open \
            | jq -r ".[] | select(.headRefName | startswith(\"fix/ci-${SAFE_BRANCH}-\")) | .number" \
            | head -1)
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already have open fix PR #$EXISTING for $BRANCH — skipping" >&2
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci --ignore-scripts

      - name: 3-stage auto-fix (OpenRouter free models)
        id: autofix
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORIGINAL_BRANCH: ${{ github.head_ref }}
        run: node scripts/autofix-openrouter.mjs

      - name: Upload stats artifact
        if: steps.guard.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fixer-stats-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}
          path: ci-fixer-stats.json
          if-no-files-found: ignore
          retention-days: 90

  merge:
    needs: [ci, staging-gate]
    if: |
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      needs.ci.result == 'success' &&
      needs.staging-gate.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Squash-merge the PR
        id: merge
        run: |
          gh pr merge --squash --match-head-commit "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.html_url }}"
          echo "sha=$(gh pr view '${{ github.event.pull_request.html_url }}' --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after PR auto-merge OR on direct push to main (e.g. GitHub UI squash-merge).
  # always() lets the job run even when `merge` was skipped (merge only runs on PRs).
  deploy-gcp:
    needs: [ci, staging-gate, merge]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      needs.staging-gate.result == 'success' &&
      !contains(github.event.pull_request.title || github.event.head_commit.message, '[nginx-only]') &&
      (needs.merge.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gcp
      cancel-in-progress: false
    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            exec 9>"$HOME/.assist-deploy.lock"
            flock -n 9 || { echo "Another deploy owns the lock"; exit 1; }
            export ASSIST_DEPLOY_LOCKED=1
            cd /home/vova/trained-assist-agent
            git fetch origin "${{ needs.merge.outputs.sha || github.sha }}"
            if [ -n "$(git status --porcelain)" ]; then
              echo "Live checkout has local changes; stashing before deploy..."
              git stash --include-untracked
            fi
            export DEPLOY_TARGET_COMMIT=$(git rev-parse FETCH_HEAD)
            git show FETCH_HEAD:scripts/drain-for-deploy.py > /tmp/assist-drain-for-deploy.py
            python3 /tmp/assist-drain-for-deploy.py
            export PREV_COMMIT=$(git rev-parse HEAD)
            git reset --hard FETCH_HEAD
            printf 'AGENT_SECRET=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\nOPENAI_API_KEY=%s\nFAL_KEY=%s\nIDEOGRAM_API_KEY=%s\nRECRAFT_API_KEY=%s\nOPENROUTER_API_KEY=%s\nZEROCREDS_ADMIN_TOKEN=%s\nGITHUB_ISSUES_TOKEN=%s\nOPENCODE_MODEL=%s\nOPENCODE_PROFILE=%s\n' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.FAL_KEY }}' \
              '${{ secrets.IDEOGRAM_API_KEY }}' \
              '${{ secrets.RECRAFT_API_KEY }}' \
              '${{ secrets.OPENROUTER_API_KEY }}' \
              '${{ secrets.ZEROCREDS_ADMIN_TOKEN }}' \
              '${{ secrets.GITHUB_ISSUES_TOKEN }}' \
              '' \
              '' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            node scripts/register-hook.js
            DEPLOY_ENV=gcp bash scripts/deploy.sh

  deploy-ru:
    needs: [ci, staging-gate, merge]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      needs.staging-gate.result == 'success' &&
      !contains(github.event.pull_request.title || github.event.head_commit.message, '[nginx-only]') &&
      (needs.merge.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ru
      cancel-in-progress: false
    steps:
      - name: Deploy to RU VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_RU_HOST }}
          username: ${{ secrets.VM_RU_USER }}
          password: ${{ secrets.VM_RU_PASSWORD }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            exec 9>"$HOME/.assist-deploy.lock"
            flock -n 9 || { echo "Another deploy owns the lock"; exit 1; }
            export ASSIST_DEPLOY_LOCKED=1
            git config --global --add safe.directory /home/vova/trained-assist-agent
            cd /home/vova/trained-assist-agent
            git fetch origin "${{ needs.merge.outputs.sha || github.sha }}"
            if [ -n "$(git status --porcelain)" ]; then
              echo "Live checkout has local changes; stashing before deploy..."
              git stash --include-untracked
            fi
            export DEPLOY_TARGET_COMMIT=$(git rev-parse FETCH_HEAD)
            git show FETCH_HEAD:scripts/drain-for-deploy.py > /tmp/assist-drain-for-deploy.py
            python3 /tmp/assist-drain-for-deploy.py
            export PREV_COMMIT=$(git rev-parse HEAD)
            git reset --hard FETCH_HEAD
            printf 'TELEGRAM_BOT_TOKEN=%s\nANTHROPIC_API_KEY=%s\nAGENT_SECRET=%s\nDEEPGRAM_API_KEY=%s\nBOT_SECRET=%s\nAGENT_PUBLIC_URL=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\nOPENAI_API_KEY=%s\nFAL_KEY=%s\nIDEOGRAM_API_KEY=%s\nRECRAFT_API_KEY=%s\nOPENROUTER_API_KEY=%s\nZEROCREDS_ADMIN_TOKEN=%s\nGITHUB_ISSUES_TOKEN=%s\nOPENCODE_MODEL=%s\nOPENCODE_PROFILE=%s\n' \
              '${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              '${{ secrets.ANTHROPIC_API_KEY }}' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.DEEPGRAM_API_KEY }}' \
              '${{ secrets.BOT_SECRET }}' \
              'https://platform.recruiter-assistant.ru' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.FAL_KEY }}' \
              '${{ secrets.IDEOGRAM_API_KEY }}' \
              '${{ secrets.RECRAFT_API_KEY }}' \
              '${{ secrets.OPENROUTER_API_KEY }}' \
              '${{ secrets.ZEROCREDS_ADMIN_TOKEN }}' \
              '${{ secrets.GITHUB_ISSUES_TOKEN }}' \
              '' \
              '' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            node scripts/register-hook.js
            DEPLOY_ENV=ru AGENT_SECRET="${{ secrets.AGENT_SECRET }}" bash scripts/deploy.sh

  notify-merge-queue:
    needs: [deploy-gcp, deploy-ru]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-gcp.result == 'success' &&
      needs.deploy-ru.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Notify merge-queue — deploy complete
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.MERGE_QUEUE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Deploy-Playbooks/merge-queue/dispatches \
            -d '{
              "event_type": "deploy_completed",
              "client_payload": {
                "repo": "${{ github.repository }}",
                "base_branch": "main"
              }
            }'
