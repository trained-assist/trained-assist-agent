name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Validates that Claude-authored PRs include a <!-- csm-session: UUID --> comment
  # so the CI callback workflow can wake up the session that created the PR.
  session-link-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for csm-session comment
        run: |
          BODY=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json body -q '.body // ""')

          # Only enforce for Claude-authored PRs (body contains Claude Code attribution).
          if ! echo "$BODY" | grep -q "Generated with \[Claude Code\]"; then
            echo "Human-authored PR — skipping session-link check."
            exit 0
          fi

          echo "Claude-authored PR detected — checking for csm-session comment..."

          # Allow explicit opt-out for PRs where Session Manager is unavailable (e.g. local dev).
          if echo "$BODY" | grep -q "<!-- csm-session-skip -->"; then
            echo "⚠️  csm-session-skip marker found — skipping check (no callback will fire for this PR)."
            exit 0
          fi

          if echo "$BODY" | grep -qP '<!-- csm-session: [\w\-]{8,} -->'; then
            echo "✅ csm-session comment found."
          else
            echo "❌ Claude-authored PR is missing a valid <!-- csm-session: UUID --> comment."
            echo ""
            echo "Without it, CI failures and merge conflicts won't wake up the session."
            echo "Fix: add the session ID to the PR body (replace SESSION_ID placeholder):"
            echo "  MY_SESSION=\$(curl -s 'http://localhost:3000/api/sessions/my-id?path=\$(pwd)' | jq -r '.sessionId // empty')"
            echo "  gh pr edit ${{ github.event.pull_request.number }} --body-file <(gh pr view ${{ github.event.pull_request.number }} --json body -q '.body' | sed \"s/SESSION_ID/\$MY_SESSION/\")"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Env-sync check
        run: node scripts/check-env-sync.js

  merge:
    needs: [ci, session-link-check]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge the PR
        run: gh pr merge --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after PR auto-merge OR on direct push to main (e.g. GitHub UI squash-merge).
  # always() lets the job run even when `merge` was skipped (merge only runs on PRs).
  deploy-gcp:
    needs: [ci, merge]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.merge.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gcp
      cancel-in-progress: false
    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/vova/trained-assist-agent
            git fetch origin main
            git reset --hard origin/main
            printf 'AGENT_SECRET=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\nOPENAI_API_KEY=%s\nFAL_KEY=%s\nIDEOGRAM_API_KEY=%s\nRECRAFT_API_KEY=%s\nOPENROUTER_API_KEY=%s\nZEROCREDS_ADMIN_TOKEN=%s\n' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.FAL_KEY }}' \
              '${{ secrets.IDEOGRAM_API_KEY }}' \
              '${{ secrets.RECRAFT_API_KEY }}' \
              '${{ secrets.OPENROUTER_API_KEY }}' \
              '${{ secrets.ZEROCREDS_ADMIN_TOKEN }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            node -e "
              const fs=require('fs'),os=require('os');
              const p=os.homedir()+'/.claude/settings.json';
              let s={};try{s=JSON.parse(fs.readFileSync(p,'utf8'));}catch{}
              s.hooks=s.hooks||{};s.hooks.PostToolUse=s.hooks.PostToolUse||[];
              const cmd='node /home/vova/trained-assist-agent/src/hooks/post-tool-use-artifacts.js';
              if(!s.hooks.PostToolUse.some(h=>h.hooks?.[0]?.command===cmd)){
                s.hooks.PostToolUse.push({matcher:'*',hooks:[{type:'command',command:cmd}]});
                fs.writeFileSync(p,JSON.stringify(s,null,2));
                console.log('Artifact hook registered');
              }else{console.log('Artifact hook already registered');}
            "
            bash scripts/deploy.sh

  deploy-ru:
    needs: [ci, merge]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.merge.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ru
      cancel-in-progress: false
    steps:
      - name: Deploy to RU VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_RU_HOST }}
          username: ${{ secrets.VM_RU_USER }}
          password: ${{ secrets.VM_RU_PASSWORD }}
          script: |
            git config --global --add safe.directory /home/vova/trained-assist-agent
            cd /home/vova/trained-assist-agent
            git fetch origin main
            git reset --hard origin/main
            printf 'TELEGRAM_BOT_TOKEN=%s\nANTHROPIC_API_KEY=%s\nAGENT_SECRET=%s\nDEEPGRAM_API_KEY=%s\nBOT_SECRET=%s\nAGENT_PUBLIC_URL=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\nOPENAI_API_KEY=%s\nFAL_KEY=%s\nIDEOGRAM_API_KEY=%s\nRECRAFT_API_KEY=%s\nOPENROUTER_API_KEY=%s\nZEROCREDS_ADMIN_TOKEN=%s\n' \
              '${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              '${{ secrets.ANTHROPIC_API_KEY }}' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.DEEPGRAM_API_KEY }}' \
              '${{ secrets.BOT_SECRET }}' \
              'https://platform.recruiter-assistant.ru' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.FAL_KEY }}' \
              '${{ secrets.IDEOGRAM_API_KEY }}' \
              '${{ secrets.RECRAFT_API_KEY }}' \
              '${{ secrets.OPENROUTER_API_KEY }}' \
              '${{ secrets.ZEROCREDS_ADMIN_TOKEN }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            node -e "
              const fs=require('fs'),os=require('os');
              const p=os.homedir()+'/.claude/settings.json';
              let s={};try{s=JSON.parse(fs.readFileSync(p,'utf8'));}catch{}
              s.hooks=s.hooks||{};s.hooks.PostToolUse=s.hooks.PostToolUse||[];
              const cmd='node /home/vova/trained-assist-agent/src/hooks/post-tool-use-artifacts.js';
              if(!s.hooks.PostToolUse.some(h=>h.hooks?.[0]?.command===cmd)){
                s.hooks.PostToolUse.push({matcher:'*',hooks:[{type:'command',command:cmd}]});
                fs.writeFileSync(p,JSON.stringify(s,null,2));
                console.log('Artifact hook registered');
              }else{console.log('Artifact hook already registered');}
            "
            AGENT_SECRET="${{ secrets.AGENT_SECRET }}" bash scripts/deploy.sh
